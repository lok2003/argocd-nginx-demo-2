apiVersion: apps/v1
kind: Deployment

metadata:
  name: httpd-demo
  namespace: argocd-demo-2

spec:
  replicas: 2

  selector:
    matchLabels:
      app: argocd-sample

  template:
    metadata:
      labels:
        app: argocd-sample

    spec:
      containers:
        - name: nginx-deploy
          image: lok2003/frontend-dashboard:v1.23
          ports:
            - containerPort: 80