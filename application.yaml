apiVersion: argoproj.io/v1alpha1 
kind: Application 
metadata:
  name: nginx-demo-2
  namespace: argocd 

spec:
  project: default 

  source: 
    repoURL: https://github.com/lok2003/argocd-nginx-demo-2.git 
    targetRevision: main 
    path: . 
  
  destination:
    server: https://kubernetes.default.svc 
    namespace: argocd-demo 

  syncPolicy:
    automated:
      prune: true 
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true 
